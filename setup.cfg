[flake8]
max-line-length = 88
jobs = 1
extend-exclude =
    .git,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
per-file-ignores =
    pacman-game/debug_game.py:E402
    pacman-game/src/game/main.py:E402
    pacman-game/src/game/maze_adapter.py:E402
    pacman-game/test_*.py:E402
    pacman-game/tests/test_*.py:E402

[mypy]
exclude = (?x)(
    ^mazegenerator-00001-py3-none-any/
    | ^pacman-game/mazegenerator-00001-py3-none-any/
    )
ignore_missing_imports = True
