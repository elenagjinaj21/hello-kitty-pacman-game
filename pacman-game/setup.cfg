[flake8]
max-line-length = 88
jobs = 1
extend-exclude =
    .git,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
per-file-ignores =
    debug_game.py:E402
    src/game/main.py:E402
    src/game/maze_adapter.py:E402
    test_*.py:E402
    tests/test_*.py:E402

[mypy]
mypy_path = src
explicit_package_bases = True
exclude = (?x)(
    ^setup\.py$
    |
    ^debug_game\.py$
    | ^test_.*\.py$
    | ^tests/
    | ^mazegenerator-00001-py3-none-any/
    )

[mypy-pygame.*]
ignore_missing_imports = True

[mypy-mazegenerator.*]
ignore_missing_imports = True
